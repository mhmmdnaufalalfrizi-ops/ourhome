function widgets(){
 const n=new Date(),tm=n.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}).replace('.',':');
 $('#ck').textContent=tm;$('#sbt').textContent=tm;$('#dt').textContent=n.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'});
 if(!D.date){$('#dn').textContent='?';$('#dl').textContent='Ketuk untuk isi tanggal jadian';$('#ym').textContent=''}
 else{const t=new Date(n);t.setHours(0,0,0,0);const s=new Date(D.date+'T00:00:00'),days=Math.floor((t-s)/864e5);
  if(days<0){$('#dn').textContent='0';$('#dl').textContent='hari bersama';$('#ym').textContent='Tanggal jadiannya masih di masa depan'}
  else{$('#dn').textContent=days.toLocaleString('id-ID');$('#dl').textContent='hari bersama';
   let y=t.getFullYear()-s.getFullYear(),m=t.getMonth()-s.getMonth(),d=t.getDate()-s.getDate();
   if(d<0){m--;d+=new Date(t.getFullYear(),t.getMonth(),0).getDate()}if(m<0){y--;m+=12}
   $('#ym').textContent=[y?y+' tahun':'',m?m+' bulan':'',d?d+' hari':''].filter(Boolean).join(' ')}}
 phr();
}

 cal:{t:'Kalender',h(){if(!D.date)return '<p class="empty">Isi tanggal jadian dulu di Pengaturan supaya kalender kalian muncul.</p>';
   const n=new Date();n.setHours(0,0,0,0);const s=new Date(D.date+'T00:00:00'),dd=x=>{const k=Math.round((x-n)/864e5);return k===0?'Hari ini!':k>0?k+' hari lagi':'Sudah lewat'};
   let c=dm(n.getFullYear(),n.getMonth(),s.getDate());if(c<n)c=dm(n.getFullYear(),n.getMonth()+1,s.getDate());

   $('#wf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=1280;c.height=720;const x=c.getContext('2d'),k=Math.max(1280/im.width,720/im.height),w=im.width*k,h=im.height*k;x.drawImage(im,(1280-w)/2,(720-h)/2,w,h);const old=D.wimg;D.wimg=c.toDataURL('image/jpeg',.72);if(!save()){D.wimg=old;return}wall();toast('Wallpaper diganti')};im.src=r.result};r.readAsDataURL(f)};

 cor:{t:'Coretan',h:()=>`<div style="display:flex;gap:22px"><div style="flex:1"><canvas id="cv" width="820" height="440" style="width:100%;aspect-ratio:820/440;background:#fff;border:2px solid #f1d5dc;border-radius:18px;touch-action:none;display:block"></canvas></div><div class="fm" style="width:190px"><label>Warna</label><div id="sw" class="swg"></div><label for="bs">Ukuran kuas</label><input id="bs" type="range" min="2" max="30" value="8" style="padding:0"><button class="pri" id="er" style="background:#8A6B78;width:100%">Penghapus</button><button class="pri" id="cl" style="background:#8A6B78;width:100%">Bersihkan</button><button class="pri" id="sv" style="width:100%">Simpan ke Memory</button></div></div>`,
  init(){const c=$('#cv'),x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,820,440);x.lineCap='round';x.lineJoin='round';let col='#E8476F',dr=false,lx=0,ly=0;
   const cs=['#E8476F','#ff8a3d','#f2c230','#3fbf7f','#3f8cff','#8a5cf0','#3B2030'];

 gal:{t:'Galeri',h:()=>`<div style="display:flex;gap:12px;align-items:center;margin-bottom:14px"><label class="pri" style="margin:0;cursor:pointer;display:inline-block">+ Tambah foto<input id="gf" type="file" accept="image/*" multiple hidden></label><span class="mut" id="gc"></span></div><div class="gg" id="gg"></div>`,
